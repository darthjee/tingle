# Codacy project configuration. See https://docs.codacy.com/related-tools-integration/coding-standards/codacy-configuration-file/
#
# Keep every exclusion scoped and narrow, and document exactly why it exists.
engines:
  bandit:
    # pytest uses plain `assert` idiomatically and tests never run under `python -O`,
    # so Bandit B101 is pure noise here (issue #194). Scoped to Bandit only: other
    # tools still analyse the tests, and production code keeps full Bandit coverage.
    exclude_paths:
      - "python/tests/**"
