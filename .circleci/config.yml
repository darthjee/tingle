version: 2.1

workflows:
  version: 2
  test:
    jobs:
      - test

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project/python
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: pip install -r requirements-dev.txt
      - run:
          name: Lint
          command: ruff check .
      - run:
          name: Tests
          command: pytest
