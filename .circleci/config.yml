version: 2.1

workflows:
  version: 2
  test:
    jobs:
      - lint
      - tests
      - setup-builder
  release:
    jobs:
      - build-and-publish-linux-image:
          filters:
            tags:
              # plain semver only — a v-prefixed tag (v1.9.0) is silently ignored
              only: /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
            branches:
              ignore: /.*/
      - update-description:
          requires:
            - build-and-publish-linux-image
          filters:
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
            branches:
              ignore: /.*/
      - build-and-publish-rubycritic-image:
          filters:
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
            branches:
              ignore: /.*/
      - update-rubycritic-description:
          requires:
            - build-and-publish-rubycritic-image
          filters:
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
            branches:
              ignore: /.*/
      - build-and-publish-js-complexity-image:
          filters:
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
            branches:
              ignore: /.*/
      - update-js-complexity-description:
          requires:
            - build-and-publish-js-complexity-image
          filters:
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
            branches:
              ignore: /.*/
      - build-and-publish-release:
          requires:
            - build-and-publish-linux-image
            - build-and-publish-rubycritic-image
            - build-and-publish-js-complexity-image
          filters:
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$/
            branches:
              ignore: /.*/

jobs:
  lint:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project/python
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: pip install -r requirements-dev.txt
      - run:
          name: Lint
          command: ruff check .
  tests:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project/python
    steps:
      - checkout:
          path: ~/project
      - run:
          name: Install dependencies
          command: pip install -r requirements-dev.txt
      - run:
          name: Tests
          command: pytest
      - run:
          name: Upload coverage to Codacy
          command: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage.xml
  setup-builder:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Set up builder
          command: scripts/release_image.sh setup-builder
  build-and-publish-linux-image:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Set up builder
          command: scripts/release_image.sh setup-builder
      - run:
          name: Build image
          command: scripts/release_image.sh build
      - run:
          name: Smoke test
          command: scripts/release_image.sh smoke-test
      - run:
          name: Scan image
          command: scripts/release_image.sh scan
      - run:
          name: Publish image
          command: scripts/release_image.sh publish
  update-description:
    machine: true
    steps:
      - checkout
      - run:
          name: Update Docker Hub description
          command: scripts/release_image.sh update-description
  build-and-publish-rubycritic-image:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Set up builder
          command: scripts/release_image.sh setup-builder
      - run:
          name: Build image
          command: scripts/release_image.sh build rubycritic
      - run:
          name: Smoke test
          command: scripts/release_image.sh smoke-test rubycritic
      - run:
          name: Scan image
          command: scripts/release_image.sh scan rubycritic
      - run:
          name: Publish image
          command: scripts/release_image.sh publish rubycritic
  update-rubycritic-description:
    machine: true
    steps:
      - checkout
      - run:
          name: Update Docker Hub description
          command: scripts/release_image.sh update-description rubycritic
  build-and-publish-js-complexity-image:
    machine:
      image: ubuntu-2404:current
    steps:
      - checkout
      - run:
          name: Set up builder
          command: scripts/release_image.sh setup-builder js_complexity
      - run:
          name: Build image
          command: scripts/release_image.sh build js_complexity
      - run:
          name: Smoke test
          command: scripts/release_image.sh smoke-test js_complexity
      - run:
          name: Scan image
          command: scripts/release_image.sh scan js_complexity
      - run:
          name: Publish image
          command: scripts/release_image.sh publish js_complexity
  update-js-complexity-description:
    machine: true
    steps:
      - checkout
      - run:
          name: Update Docker Hub description
          command: scripts/release_image.sh update-description js_complexity
  build-and-publish-release:
    machine: true
    steps:
      - checkout
      - run:
          name: Build release zip
          command: scripts/release_cli.sh build
      - run:
          name: Publish release
          command: scripts/release_cli.sh publish
