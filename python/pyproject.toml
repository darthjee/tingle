[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# kube/auth.py carries a bare `# noqa` for Prospector (Codacy), not for ruff;
# it suppresses a dodgy false positive on an env var *name* (issue #192).
"kube/auth.py" = ["RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing --cov-report=xml --cov-fail-under=75"

[tool.coverage.run]
source = ["check_file_size", "common", "kube"]
omit = ["tests/*"]
